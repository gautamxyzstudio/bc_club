      <div style="display:grid;gap:8px;margin-top:14px"><button class="bcl-btn pri" data-act="book">${IC.key}${isSold(l) ? "Ask about this home" : "Book a showing"}</button><button class="bcl-btn" data-act="ask">${IC.chat}Ask a question</button></div></div>
      <div class="bcl-card bcl-agent">${A.photo ? `<img src="${esc(A.photo)}" alt="" style="width:52px;height:52px;border-radius:50%;object-fit:cover">` : `<span class="bcl-av">${esc(ini)}</span>`}<div><b>${esc(A.name)}</b><small>${esc(A.role || "")}</small>${A.phone ? `<br><a href="tel:${esc(String(A.phone).replace(/[^\d+]/g, ""))}" style="font-weight:700">${esc(A.phone)}</a>` : ""}</div></div>`; }

  function legal(l) { return `<div class="bcl-legal"><p>The trademarks MLS®, Multiple Listing Service® and the associated logos are owned by The Canadian Real Estate Association (CREA) and identify the quality of services provided by real estate professionals who are members of CREA. Listing courtesy of ${esc((l.brokerage || "the listing brokerage").replace(/\.$/, ""))}. Information is believed reliable but not guaranteed.</p>
    <p>Assessment public data. Walk and drive times, scores and costs are estimates. "Sponsored" partners pay to appear on this page; you are free to use any lender or insurer.</p></div>`; }

  function jsonLd(l) { const d = { "@context": "https://schema.org", "@type": "RealEstateListing", name: `${l.address}, ${l.city || ""}`, url: location.href.split("#")[0], datePosted: l.listedOn, image: (l.photos || []).slice(0, 3),
      offers: { "@type": "Offer", price: l.price, priceCurrency: "CAD", availability: isSold(l) ? "https://schema.org/SoldOut" : "https://schema.org/InStock" },
      itemOffered: { "@type": l.ownership === "Strata" ? "Apartment" : "SingleFamilyResidence", numberOfRooms: l.beds, numberOfBathroomsTotal: l.baths, floorSize: l.sqft ? { "@type": "QuantitativeValue", value: l.sqft, unitCode: "FTK" } : undefined, yearBuilt: l.year,
        address: { "@type": "PostalAddress", streetAddress: l.address, addressLocality: l.city, addressRegion: "BC", postalCode: l.postal, addressCountry: "CA" }, geo: l.lat ? { "@type": "GeoCoordinates", latitude: l.lat, longitude: l.lng } : undefined } };
    let s = document.getElementById("bclLd"); if (!s) { s = document.createElement("script"); s.type = "application/ld+json"; s.id = "bclLd"; document.head.appendChild(s); } s.textContent = JSON.stringify(d); }

  function render(l) { L = l; MC.down = null; saved = false;
    $("#bclRoot").innerHTML = gallery(l) + `<div class="bcl-grid"><div class="bcl-main">${head(l)}${actions(l)}${tabs(l)}${openHouse(l)}${facts(l)}${assess(l)}${history(l)}${strata(l)}${nearby(l)}${schools(l)}${details(l)}${market(l)}${mortgage(l)}${insurance(l)}${similar(l)}${legal(l)}</div><aside class="bcl-side">${side(l)}</aside></div>`;
    $("#bclBar").innerHTML = `<div><b>${isSold(l) ? "Sold " : ""}${money(isSold(l) ? l.soldPrice || l.price : l.price)}</b><small>${esc(l.address)}</small></div><button class="bcl-btn pri" data-act="book">${IC.key}<span class="bcl-l">${isSold(l) ? "Ask about it" : "Book a showing"}</span><span class="bcl-s">${isSold(l) ? "Ask" : "Book"}</span></button>`;
    document.title = `${l.address}, ${l.city || ""} · ${money(l.price)} · BC Real Estate Market`;
    if (!isSold(l) && l.price) { calcRender(); const dp = $("#bclDp"), dr = $("#bclDpR"), rt = $("#bclRate");
      dp.addEventListener("input", () => { MC.down = +dp.value.replace(/[^\d]/g, "") || 0; calcRender(); });
      dr.addEventListener("input", () => { MC.down = Math.round(l.price * dr.value / 100); dp.value = MC.down; calcRender(); });
      rt.addEventListener("input", () => { const v = parseFloat(rt.value); if (v > 0 && v < 25) { MC.rate = v; calcRender(); } });
      $("#bclAm").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return; MC.amort = +b.dataset.am; calcRender(); }); }
    jsonLd(l); spy(); }

  // section tabs follow the scroll
  let spyObs = null;
  function spy() { if (spyObs) spyObs.disconnect(); if (!("IntersectionObserver" in window)) return; const tabsEl = document.querySelectorAll(".bcl-tab");
    spyObs = new IntersectionObserver(es => { es.forEach(e => { if (!e.isIntersecting) return; tabsEl.forEach(t => { const on = t.getAttribute("href") === "#" + e.target.id; t.classList.toggle("on", on); if (on) t.scrollIntoView({ block: "nearest", inline: "nearest" }); }); }); }, { rootMargin: "-35% 0px -60% 0px" });
    document.querySelectorAll(".bcl-sec[id]").forEach(s => spyObs.observe(s)); }

  // ######## PART 5: BOOK A SHOWING + QUESTION + PARTNER FORMS (each sends to a hook; demo shows a message) ########
  function openSheet(html, back) { const sh = $("#bclSheet"); $("#bclPanel").innerHTML = html; sh.hidden = false; sheetBack = back || document.activeElement; document.body.style.overflow = "hidden"; setTimeout(() => { const f = $("#bclPanel input, #bclPanel button:not(.bcl-x)"); f && f.focus(); }, 30); }
  function closeSheet() { $("#bclSheet").hidden = true; document.body.style.overflow = ""; sheetBack && sheetBack.focus && sheetBack.focus(); }
  const contactFields = `<div><label for="bclN">Name</label><input type="text" id="bclN" autocomplete="name"></div><div><label for="bclC">Phone or email</label><input type="text" id="bclC" autocomplete="email" inputmode="email"></div>`;
  const okContact = c => /\S+@\S+\.\S+/.test(c) || c.replace(/\D/g, "").length >= 10;
  function bookForm() { const days = [], d0 = new Date(); for (let i = 0; i < 10; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i + 1); days.push(d); }
    openSheet(`<h2 id="bclSheetT">${isSold(L) ? "Ask about this home" : "Book a showing"} <button class="bcl-x" data-act="close" aria-label="Close">×</button></h2><p class="bcl-note" style="margin-top:4px">${esc(L.address)}</p>
      <form class="bcl-form" id="bclBook" novalidate>${isSold(L) ? "" : `<div><label>Pick a day</label><div class="bcl-days" id="bclDays">${days.map((d, i) => `<button type="button" data-day="${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}" class="${i ? "" : "on"}">${d.toLocaleDateString("en-CA", { weekday: "short" })}<b>${d.getDate()}</b>${d.toLocaleDateString("en-CA", { month: "short" })}</button>`).join("")}</div></div>
        <div><label>Time</label><div class="bcl-seg" id="bclTime"><button type="button" class="on">Morning</button><button type="button">Afternoon</button><button type="button">Evening</button></div></div>
        <div><label>How</label><div class="bcl-seg" id="bclHow"><button type="button" class="on">In person</button><button type="button">Video call</button></div></div>`}
        ${contactFields}<div><label>Are you working with a REALTOR®?</label><div class="bcl-seg" id="bclAgent"><button type="button">Yes</button><button type="button" class="on">No</button></div></div>
        <div><label for="bclM">Message (optional)</label><textarea id="bclM" placeholder="Anything we should know?"></textarea></div><div class="bcl-err" id="bclErr"></div>
        <button class="bcl-btn pri" type="submit">${isSold(L) ? "Send" : "Request this time"}</button><p class="bcl-note" style="margin:0">We'll confirm by phone or email. No obligation.</p></form>`); }
  function askForm() { openSheet(`<h2 id="bclSheetT">Ask a question <button class="bcl-x" data-act="close" aria-label="Close">×</button></h2><form class="bcl-form" id="bclAsk" novalidate>${contactFields}<div><label for="bclM">Your question</label><textarea id="bclM">Is this home still available? </textarea></div><div class="bcl-err" id="bclErr"></div><button class="bcl-btn pri" type="submit">Send question</button></form>`); }
  function partnerForm(kind) { openSheet(`<h2 id="bclSheetT">${kind === "mortgage" ? "Get pre-approved" : "Get an insurance quote"} <button class="bcl-x" data-act="close" aria-label="Close">×</button></h2><p class="bcl-note" style="margin-top:4px">Your details go to our ${kind === "mortgage" ? "mortgage" : "insurance"} partner for ${esc(L.address)}. <span class="bcl-spons">Sponsored</span></p><form class="bcl-form" id="bclPart" data-kind="${kind}" novalidate>${contactFields}<label class="bcl-check"><input type="checkbox" id="bclOk"> I agree to be contacted by this partner about my request.</label><div class="bcl-err" id="bclErr"></div><button class="bcl-btn org" type="submit">Send</button></form>`); }
  function lead(extra) { const c = $("#bclC").value.trim(); if (!okContact(c)) { $("#bclErr").textContent = "Add a phone number or email so we can reach you."; $("#bclC").focus(); return null; }
    return Object.assign({ name: $("#bclN").value.trim(), contact: c, message: ($("#bclM") || {}).value || "", mls: L.mls, address: L.address, price: L.price, url: location.href.split("#")[0] }, extra); }
  const sendTo = (fn, data, ok) => { if (typeof CFG[fn] === "function") { try { CFG[fn](data); } catch (e) {} toast(ok); } else toast(ok + " (demo: on your site this goes to your inbox or CRM)"); closeSheet(); };
  const segVal = id => { const b = document.querySelector(`#${id} button.on`); return b ? (b.dataset.day || b.textContent) : ""; };

  document.addEventListener("click", e => { const b = e.target.closest("[data-act], .bcl-seg button, .bcl-days button, [data-demo]"); if (!b || !b.closest(".bcl")) return;
    if (b.dataset.demo) { document.querySelectorAll("[data-demo]").forEach(x => x.classList.toggle("on", x === b)); render(SAMPLES[b.dataset.demo]); scrollTo(0, 0); return; }
    if (b.matches(".bcl-seg button, .bcl-days button") && !b.dataset.act && !b.dataset.am) { b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); return; }
    const a = b.dataset.act; if (!a) return;
    if (a === "book") bookForm(); else if (a === "ask") askForm(); else if (a === "close") closeSheet();
    else if (a === "partner") partnerForm(b.dataset.kind);
    else if (a === "pcall") { if (typeof CFG.onPartnerLead === "function") CFG.onPartnerLead({ kind: b.dataset.kind, type: "call", mls: L.mls, address: L.address }); }
    else if (a === "save") { saved = !saved; b.classList.toggle("on", saved); b.setAttribute("aria-pressed", saved); if (typeof CFG.onSave === "function") CFG.onSave(L, saved); toast(saved ? "Saved to your homes" : "Removed from saved"); }
    else if (a === "share") { const u = location.href.split("#")[0]; if (navigator.share) navigator.share({ title: L.address, url: u }).catch(() => {}); else if (navigator.clipboard) navigator.clipboard.writeText(u).then(() => toast("Link copied"), () => toast(u)); else toast(u); }
    else if (a === "more") { const d = $("#bclDesc"), open = d.classList.toggle("clamp"); b.textContent = open ? "Read more" : "Show less"; b.setAttribute("aria-expanded", !open); }
    else if (a === "photos") { if (typeof CFG.onPhotos === "function") CFG.onPhotos(L); else toast("Opens your photo gallery"); }
    else if (a === "signin") { if (typeof CFG.onSignIn === "function") CFG.onSignIn(); else toast("Opens your sign-in"); } });
  document.addEventListener("submit", e => { const f = e.target; if (!f.closest(".bcl")) return; e.preventDefault();
    if (f.id === "bclBook") { const d = lead({ type: isSold(L) ? "question" : "showing", day: isSold(L) ? "" : segVal("bclDays"), time: segVal("bclTime"), how: segVal("bclHow"), hasAgent: segVal("bclAgent") === "Yes" }); if (d) sendTo("onBookShowing", d, isSold(L) ? "Thanks, we'll get back to you soon" : "Request sent. We'll confirm your showing time"); }
    else if (f.id === "bclAsk") { const d = lead({ type: "question" }); if (d) sendTo("onQuestion", d, "Question sent. We'll reply soon"); }
    else if (f.id === "bclPart") { if (!$("#bclOk").checked) { $("#bclErr").textContent = "Please tick the box so the partner can contact you."; return; } const d = lead({ kind: f.dataset.kind, type: "quote" }); if (d) sendTo("onPartnerLead", d, "Sent. They'll contact you soon"); } });
  $("#bclSheet").addEventListener("click", e => { if (e.target.id === "bclSheet") closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#bclSheet").hidden) closeSheet(); });

  // ######## PART 6: START-UP ########
  window.BCListing = { render, _calc: { pay, ptt, minDown, cmhcPct } };
  render(CFG.listing || (DEMO ? SAMPLES.condo : null) || { address: "Listing not found", photos: [] });
})();
</script>
</body>
</html>
